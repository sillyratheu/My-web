<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotRa - Your Best Friend</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
        
        /* Gemini Style Header */
        header { background-color: #1e1f20; padding: 14px 24px; border-bottom: 1px solid #282a2c; display: flex; align-items: center; gap: 14px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #8ab4f8; }
        .header-info h1 { font-size: 18px; color: #f2f2f2; font-weight: 500; letter-spacing: 0.3px; }
        .header-info p { font-size: 12px; color: #a8c7fa; }
        
        /* Chat Container */
        #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; max-width: 800px; width: 100%; margin: 0 auto; }
        
        .message { max-width: 85%; padding: 14px 18px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
        .user-message { background-color: #2b2c2f; color: #f2f2f2; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-message { background-color: #1e1f20; color: #e3e3e3; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #282a2c; }
        
        /* Thinking animation */
        .thinking { font-style: italic; color: #a8c7fa; display: flex; align-items: center; gap: 6px; }
        .thinking span { height: 6px; width: 6px; background-color: #8ab4f8; border-radius: 50%; display: inline-block; animation: bounce 1.2s infinite ease-in-out; }
        .thinking span:nth-child(2) { animation-delay: -0.4s; }
        .thinking span:nth-child(3) { animation-delay: -0.2s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        /* Input Area - Gemini Style */
        .input-wrapper { background-color: #1e1f20; padding: 16px 24px; border-top: 1px solid #282a2c; display: flex; justify-content: center; }
        .input-box { max-width: 800px; width: 100%; background-color: #2b2c2f; border-radius: 28px; display: flex; align-items: center; padding: 8px 16px; border: 1px solid transparent; transition: border 0.3s; }
        .input-box:focus-within { border-color: #8ab4f8; }
        input { flex: 1; background: transparent; border: none; color: #e3e3e3; font-size: 15px; outline: none; padding: 8px; }
        button { background-color: #8ab4f8; color: #111; border: none; border-radius: 50%; width: 36px; height: 36px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        button:hover { background-color: #aecbfa; }
    </style>
</head>
<body>

    <header>
        <!-- Sundor akta AI avatar image -->
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=80" alt="NotRa" class="avatar">
        <div class="header-info">
            <h1>NotRa - Your Best Friend</h1>
            <p>Always here for you</p>
        </div>
    </header>

    <div id="chat-container">
        <div class="message ai-message">Hey there! I'm NotRa, your best friend. What's on your mind today?</div>
    </div>

    <div class="input-wrapper">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Ask NotRa anything..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">&#x27A4;</button>
        </div>
    </div>

    <script>
        const API_URL = "https://my-ai-n4y6.onrender.com/generate";

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const text = inputField.value.trim();

            if (!text) return;

            chatContainer.innerHTML += `<div class="message user-message">${escapeHtml(text)}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="message ai-message thinking">
                    NotRa is thinking<span></span><span></span><span></span>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.status === "success") {
                    chatContainer.innerHTML += `<div class="message ai-message">${escapeHtml(data.reply)}</div>`;
                } else {
                    chatContainer.innerHTML += `<div class="message ai-message">Hmm, something went wrong. Let's try again!</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message">Network error, but I'm right here with you!</div>`;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
  </html>
